name: Deploy Development

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    env:
      DEV_SPREADSHEET_ID: 1lmiGLeTsT6RRPG4N_hucomsA9PMlUgeljQdffL6GbYY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Validate development secrets
        env:
          GAS_CLIENT_ID: ${{ secrets.GAS_CLIENT_ID }}
          GAS_CLIENT_SECRET: ${{ secrets.GAS_CLIENT_SECRET }}
          GAS_REFRESH_TOKEN: ${{ secrets.GAS_REFRESH_TOKEN }}
          DEV_GAS_DEPLOYMENT_ID: ${{ secrets.DEV_GAS_DEPLOYMENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          for name in GAS_CLIENT_ID GAS_CLIENT_SECRET GAS_REFRESH_TOKEN DEV_GAS_DEPLOYMENT_ID GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name secret is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build clasp credentials
        env:
          GAS_CLIENT_ID: ${{ secrets.GAS_CLIENT_ID }}
          GAS_CLIENT_SECRET: ${{ secrets.GAS_CLIENT_SECRET }}
          GAS_REFRESH_TOKEN: ${{ secrets.GAS_REFRESH_TOKEN }}
        run: |
          jq -n \
            --arg clientId "$GAS_CLIENT_ID" \
            --arg clientSecret "$GAS_CLIENT_SECRET" \
            --arg refreshToken "$GAS_REFRESH_TOKEN" \
            '{
              oauth2ClientSettings: {
                clientId: $clientId,
                clientSecret: $clientSecret,
                redirectUri: "https://developers.google.com/oauthplayground"
              },
              token: {
                refresh_token: $refreshToken,
                token_type: "Bearer"
              },
              isLocalCreds: true
            }' > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify OAuth scopes
        env:
          GAS_CLIENT_ID: ${{ secrets.GAS_CLIENT_ID }}
          GAS_CLIENT_SECRET: ${{ secrets.GAS_CLIENT_SECRET }}
          GAS_REFRESH_TOKEN: ${{ secrets.GAS_REFRESH_TOKEN }}
        run: |
          response="$(curl -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GAS_CLIENT_ID" \
            --data-urlencode "client_secret=$GAS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GAS_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          access_token="$(printf '%s' "$response" | jq -r '.access_token // empty')"
          if [ -z "$access_token" ]; then
            echo "Could not exchange the refresh token for an access token."
            printf '%s' "$response" | jq '{error, error_description}'
            exit 1
          fi
          scope="$(curl -sS "https://oauth2.googleapis.com/tokeninfo?access_token=$access_token" | jq -r '.scope // empty')"
          echo "Granted OAuth scopes:"
          printf '%s\n' "$scope" | tr ' ' '\n' | sort
          printf '%s' "$scope" | grep -q 'https://www.googleapis.com/auth/script.projects' || {
            echo "Missing required scope: script.projects"
            exit 1
          }
          printf '%s' "$scope" | grep -q 'https://www.googleapis.com/auth/script.deployments' || {
            echo "Missing required scope: script.deployments"
            exit 1
          }

      - name: Inject development configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          code_path = Path('src/Code.gs')
          code = code_path.read_text(encoding='utf-8')
          replacements = {
              '__SPREADSHEET_ID__': '${{ env.DEV_SPREADSHEET_ID }}',
              '__BUILD_SHA__': os.environ['GITHUB_SHA'][:7],
              '__BUILD_TIME__': datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z'),
          }
          for marker, value in replacements.items():
              if marker not in code:
                  raise SystemExit(f'{marker} placeholder is missing from src/Code.gs')
              code = code.replace(marker, value)
          code_path.write_text(code, encoding='utf-8')

          secret_path = Path('src/DeploymentSecrets.gs')
          secret_text = secret_path.read_text(encoding='utf-8')
          marker = '__GEMINI_API_KEY__'
          if marker not in secret_text:
              raise SystemExit('Gemini API key placeholder is missing from src/DeploymentSecrets.gs')
          secret_text = secret_text.replace(marker, json.dumps(os.environ['GEMINI_API_KEY'])[1:-1])
          secret_path.write_text(secret_text, encoding='utf-8')
          PY

      - name: Validate GAS source
        run: |
          if [ ! -f "src/appsscript.json" ]; then
            echo "src/appsscript.json is missing."
            exit 1
          fi
          jq -e '.webapp.access and .webapp.executeAs' src/appsscript.json >/dev/null || {
            echo "src/appsscript.json must contain webapp configuration."
            exit 1
          }
          if grep -q '__GEMINI_API_KEY__' src/DeploymentSecrets.gs; then
            echo "Gemini API key was not injected."
            exit 1
          fi

      - name: Show files to deploy
        run: clasp show-file-status

      - name: Push to development Apps Script
        run: clasp push --force

      - name: Create development version
        id: version
        run: |
          description="Development ${GITHUB_SHA::7}"
          output="$(clasp create-version "$description")"
          echo "$output"
          version="$(printf '%s\n' "$output" | grep -Eo '[0-9]+' | tail -1)"
          if [ -z "$version" ]; then
            echo "Could not determine Apps Script version number."
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Update development web app deployment
        env:
          DEV_GAS_DEPLOYMENT_ID: ${{ secrets.DEV_GAS_DEPLOYMENT_ID }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          clasp create-deployment \
            --deploymentId "$DEV_GAS_DEPLOYMENT_ID" \
            --versionNumber "$VERSION_NUMBER" \
            --description "Development ${GITHUB_SHA::7}"

      - name: Verify web app entry point
        env:
          GAS_CLIENT_ID: ${{ secrets.GAS_CLIENT_ID }}
          GAS_CLIENT_SECRET: ${{ secrets.GAS_CLIENT_SECRET }}
          GAS_REFRESH_TOKEN: ${{ secrets.GAS_REFRESH_TOKEN }}
          DEV_GAS_DEPLOYMENT_ID: ${{ secrets.DEV_GAS_DEPLOYMENT_ID }}
        run: |
          response="$(curl -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GAS_CLIENT_ID" \
            --data-urlencode "client_secret=$GAS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GAS_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          access_token="$(printf '%s' "$response" | jq -r '.access_token // empty')"
          script_id="$(jq -r '.scriptId' .clasp.json)"
          deployment="$(curl -fsS \
            -H "Authorization: Bearer $access_token" \
            "https://script.googleapis.com/v1/projects/$script_id/deployments/$DEV_GAS_DEPLOYMENT_ID")"
          entry_type="$(printf '%s' "$deployment" | jq -r '.entryPoints[0].entryPointType // empty')"
          web_url="$(printf '%s' "$deployment" | jq -r '.entryPoints[]? | select(.entryPointType=="WEB_APP") | .webApp.url' | head -1)"
          echo "Deployment entry point: $entry_type"
          if [ -z "$web_url" ]; then
            echo "Deployment is not a WEB_APP."
            exit 1
          fi
          echo "Development web app URL: $web_url"

      - name: Show deployment result
        run: |
          echo "Development source, Gemini secret, and versioned web app deployment were updated."
          echo "Apps Script version: ${{ steps.version.outputs.number }}"
