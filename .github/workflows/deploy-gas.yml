name: Deploy Development

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    env:
      DEV_SPREADSHEET_ID: 1lmiGLeTsT6RRPG4N_hucomsA9PMlUgeljQdffL6GbYY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Validate development secrets
        env:
          GAS_CLIENT_ID: ${{ secrets.GAS_CLIENT_ID }}
          GAS_CLIENT_SECRET: ${{ secrets.GAS_CLIENT_SECRET }}
          GAS_REFRESH_TOKEN: ${{ secrets.GAS_REFRESH_TOKEN }}
        run: |
          missing=0
          for name in GAS_CLIENT_ID GAS_CLIENT_SECRET GAS_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "$name secret is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build clasp credentials
        env:
          GAS_CLIENT_ID: ${{ secrets.GAS_CLIENT_ID }}
          GAS_CLIENT_SECRET: ${{ secrets.GAS_CLIENT_SECRET }}
          GAS_REFRESH_TOKEN: ${{ secrets.GAS_REFRESH_TOKEN }}
        run: |
          jq -n \
            --arg clientId "$GAS_CLIENT_ID" \
            --arg clientSecret "$GAS_CLIENT_SECRET" \
            --arg refreshToken "$GAS_REFRESH_TOKEN" \
            '{
              oauth2ClientSettings: {
                clientId: $clientId,
                clientSecret: $clientSecret,
                redirectUri: "https://developers.google.com/oauthplayground"
              },
              token: {
                refresh_token: $refreshToken,
                token_type: "Bearer"
              },
              isLocalCreds: true
            }' > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Inject development configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Code.gs')
          text = path.read_text(encoding='utf-8')
          marker = '__SPREADSHEET_ID__'
          if marker not in text:
              raise SystemExit('Spreadsheet ID placeholder is missing from src/Code.gs')
          text = text.replace(marker, '${{ env.DEV_SPREADSHEET_ID }}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate GAS source
        run: |
          if [ ! -f "src/appsscript.json" ]; then
            echo "src/appsscript.json is missing."
            exit 1
          fi

      - name: Show files to deploy
        run: clasp status

      - name: Push to development Apps Script
        run: clasp push --force
