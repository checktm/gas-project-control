<script>
(function(){
  function ensureMailWorkspace(){
    const modeBar=$('inquiryDetailModeBar');
    const workspace=$('inquiryCommunicationWorkspace');
    const reply=document.querySelector('#inquiryDetailContent .inquiry-reply-section');
    const messages=document.querySelector('#inquiryDetailContent .message-section');
    if(!modeBar||!workspace||!reply||!messages)return;

    modeBar.innerHTML='\
      <button type="button" class="inquiry-detail-mode active" data-detail-mode="manage">管理情報</button>\
      <button type="button" class="inquiry-detail-mode" data-detail-mode="mail">メール対応 <span id="communicationMessageCount"></span></button>';

    workspace.innerHTML='';
    const mailPanel=document.createElement('div');
    mailPanel.className='inquiry-communication-panel inquiry-mail-workspace';
    mailPanel.dataset.communicationPanel='mail';
    workspace.appendChild(mailPanel);
    mailPanel.appendChild(reply);
    mailPanel.appendChild(messages);

    let targetMeta=$('inquiryReplyTargetMeta');
    if(!targetMeta){
      targetMeta=document.createElement('div');
      targetMeta.id='inquiryReplyTargetMeta';
      targetMeta.className='reply-target-meta';
      const heading=reply.querySelector('.inquiry-reply-heading');
      if(heading)heading.insertAdjacentElement('afterend',targetMeta);
    }

    modeBar.onclick=function(e){
      const button=e.target.closest('[data-detail-mode]');
      if(!button)return;
      setInquiryDetailMode(button.dataset.detailMode);
    };

    $('sendInquiryReplyButton').onclick=sendInquiryReplyFromScreen;
  }

  window.setInquiryDetailMode=function(mode){
    const modeBar=$('inquiryDetailModeBar');
    const form=$('inquiryForm');
    const workspace=$('inquiryCommunicationWorkspace');
    if(!modeBar||!form||!workspace)return;
    const resolved=mode==='manage'?'manage':'mail';
    modeBar.querySelectorAll('[data-detail-mode]').forEach(function(button){
      button.classList.toggle('active',button.dataset.detailMode===resolved);
    });
    if(resolved==='manage'){
      form.classList.remove('detail-mode-hidden');
      workspace.classList.add('hidden');
    }else{
      form.classList.add('detail-mode-hidden');
      workspace.classList.remove('hidden');
      const panel=workspace.querySelector('[data-communication-panel="mail"]');
      if(panel)panel.classList.add('active');
    }
  };

  const baseUpdateReplyUi=window.updateInquiryReplyUi;
  window.updateInquiryReplyUi=function(){
    if(typeof baseUpdateReplyUi==='function')baseUpdateReplyUi();
    const meta=$('inquiryReplyTargetMeta');
    const inquiry=findInquiry(inquiryState.selectedId);
    if(!meta)return;
    const inbound=getLatestInboundMessageForReply();
    if(!inquiry||!inbound){
      meta.textContent='';
      return;
    }
    const recipient=String(inbound.fromEmail||inquiry.contactEmail||'不明');
    const date=inbound.sentAt?formatLongDateTime(inbound.sentAt):'日時不明';
    const subject=String(inbound.subject||inquiry.subject||'(件名なし)');
    meta.innerHTML='<span><strong>返信先</strong> '+escapeHtml(recipient)+'</span><span><strong>返信対象</strong> '+escapeHtml(date)+' / '+escapeHtml(subject)+'</span>';
  };

  function installMailWorkspaceStyles(){
    if(document.getElementById('inquiryMailWorkspaceStyles'))return;
    const style=document.createElement('style');
    style.id='inquiryMailWorkspaceStyles';
    style.textContent='\
      .reply-target-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 8px;padding:7px 9px;border:1px solid #dbe3ee;border-radius:8px;background:#f8fafc;font-size:10px;color:#475569}\
      .reply-target-meta strong{color:#334155}\
      @media(min-width:761px){\
        .inquiry-mail-workspace{display:flex!important;flex-direction:column;height:100%;min-height:0;overflow:hidden!important}\
        .inquiry-mail-workspace .inquiry-reply-section{flex:0 0 auto;min-height:0!important;padding:10px 14px!important;border-bottom:1px solid #e2e8f0}\
        .inquiry-mail-workspace .reply-textarea{min-height:76px!important;max-height:130px!important}\
        .inquiry-mail-workspace .message-section{flex:1 1 auto;min-height:0!important;overflow-y:auto!important;padding:10px 14px 18px!important}\
        .inquiry-mail-workspace .message-section>.section-heading{display:flex!important;margin-bottom:8px}\
      }\
      @media(max-width:760px){\
        .inquiry-mail-workspace .inquiry-reply-section{position:sticky;top:94px;z-index:3;background:#fff!important;border-bottom:1px solid #e2e8f0}\
      }\
    ';
    document.head.appendChild(style);
  }

  const previousRender=window.renderInquiryDetail;
  window.renderInquiryDetail=function(){
    previousRender();
    ensureMailWorkspace();
    updateInquiryReplyUi();
    syncCommunicationMessageCount();
  };

  installMailWorkspaceStyles();
  ensureMailWorkspace();
})();
</script>
