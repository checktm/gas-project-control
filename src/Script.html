<script>
const TODAY='2026-10-14';let mode='day',start='2026-10-07',selected=null;const collapsed=new Set();
const tasks=[
{id:'p',type:'project',parent:null,name:'社内基幹システム刷新',assignee:'',progress:42,status:'進行中',ps:'2026-10-01',pe:'2027-03-31',as:'2026-10-01',ae:'',note:''},
{id:'r',type:'phase',parent:'p',name:'要件定義',assignee:'',progress:78,status:'進行中',ps:'2026-10-01',pe:'2026-10-21',as:'2026-10-01',ae:'',note:''},
{id:'r1',type:'task',parent:'r',name:'業務ヒアリング',assignee:'佐藤',progress:100,status:'完了',ps:'2026-10-01',pe:'2026-10-06',as:'2026-10-01',ae:'2026-10-06',note:'主要部門のヒアリング完了'},
{id:'r2',type:'task',parent:'r',name:'要件整理',assignee:'田中',progress:70,status:'進行中',ps:'2026-10-05',pe:'2026-10-14',as:'2026-10-06',ae:'',note:'業務フローの確認待ちあり'},
{id:'r3',type:'task',parent:'r',name:'要件レビュー',assignee:'鈴木',progress:0,status:'未着手',ps:'2026-10-15',pe:'2026-10-21',as:'',ae:'',note:''},
{id:'d',type:'phase',parent:'p',name:'設計',assignee:'',progress:15,status:'進行中',ps:'2026-10-20',pe:'2026-11-18',as:'',ae:'',note:''},
{id:'d1',type:'task',parent:'d',name:'基本設計',assignee:'佐藤',progress:20,status:'進行中',ps:'2026-10-20',pe:'2026-11-05',as:'2026-10-22',ae:'',note:''},
{id:'d2',type:'task',parent:'d',name:'詳細設計',assignee:'田中',progress:0,status:'未着手',ps:'2026-11-02',pe:'2026-11-18',as:'',ae:'',note:''},
{id:'i',type:'phase',parent:'p',name:'開発',assignee:'',progress:0,status:'未着手',ps:'2026-11-16',pe:'2027-01-22',as:'',ae:'',note:''},
{id:'i1',type:'task',parent:'i',name:'API実装',assignee:'田中',progress:0,status:'未着手',ps:'2026-11-16',pe:'2026-12-18',as:'',ae:'',note:''},
{id:'i2',type:'task',parent:'i',name:'画面実装',assignee:'鈴木',progress:0,status:'未着手',ps:'2026-11-24',pe:'2027-01-08',as:'',ae:'',note:''}
];
const $=id=>document.getElementById(id),date=s=>new Date(s+'T00:00:00'),days=(a,b)=>Math.round((date(b)-date(a))/86400000),kids=id=>tasks.filter(t=>t.parent===id);
function depth(t){let n=0,p=t.parent;while(p){n++;p=tasks.find(x=>x.id===p)?.parent||null}return n}
function delayed(t){return t.type==='task'&&t.status!=='保留'&&t.status!=='完了'&&t.progress<100&&((!t.as&&t.status==='未着手'&&t.ps<TODAY)||t.pe<TODAY)}
function hierarchyVisible(t){let p=t.parent;while(p){if(collapsed.has(p))return false;p=tasks.find(x=>x.id===p)?.parent||null}return true}
function filterVisible(t){if(t.type!=='task')return true;const a=$('assigneeFilter').value,s=$('statusFilter').value;return(a==='all'||t.assignee===a)&&(s==='all'||t.status===s)&&(!$('delayOnly').checked||delayed(t))}
function visible(){const direct=tasks.filter(t=>hierarchyVisible(t)&&filterVisible(t)),ids=new Set(direct.map(t=>t.id));direct.forEach(t=>{let p=t.parent;while(p){ids.add(p);p=tasks.find(x=>x.id===p)?.parent||null}});return tasks.filter(t=>ids.has(t.id)&&hierarchyVisible(t))}
function cfg(){return mode==='day'?{w:34,count:42,step:1}:{w:92,count:11,step:7}}
function addDays(s,n){const d=date(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function header(){const c=cfg(),week=['日','月','火','水','木','金','土'];let top='',bottom='';for(let i=0;i<c.count;i++){const ds=addDays(start,i*c.step),d=date(ds);top+=`<div class="month-cell" style="width:${c.w}px">${i===0||d.getDate()<=c.step?d.getFullYear()+'年'+(d.getMonth()+1)+'月':''}</div>`;bottom+=`<div class="unit-cell ${mode==='day'&&[0,6].includes(d.getDay())?'weekend':''} ${ds===TODAY?'today':''}" style="width:${c.w}px">${mode==='day'?d.getDate()+week[d.getDay()]:(d.getMonth()+1)+'/'+d.getDate()+'週'}</div>`}$('timelineHeader').innerHTML=`<div class="timeline-month-row">${top}</div><div class="timeline-unit-row">${bottom}</div>`}
function pill(t){return delayed(t)?'delay':t.status==='完了'?'done':t.status==='保留'?'hold':t.status==='進行中'?'progress':''}
function render(){header();const c=cfg(),rows=visible(),left=$('taskRows'),right=$('timelineRows'),width=c.w*c.count;left.innerHTML='';right.innerHTML='';$('timelineHeader').style.width=right.style.width=width+'px';rows.forEach(t=>{const r=document.createElement('div');r.className=`task-row grid-row ${t.type} ${selected===t.id?'selected':''}`;r.dataset.id=t.id;const has=kids(t.id).length>0;r.innerHTML=`<div class="task-name" style="padding-left:${10+depth(t)*20}px">${has?`<button class="expander" data-toggle="${t.id}">${collapsed.has(t.id)?'▶':'▼'}</button>`:'<span class="expander"></span>'}<span>${t.name}</span></div><div>${t.assignee||'—'}</div><div>${t.progress}%</div><div><span class="status-pill ${pill(t)}">${delayed(t)?'遅延':t.status}</span></div>`;left.appendChild(r);
const tr=document.createElement('div');tr.className=`timeline-row ${t.type}`;tr.dataset.id=t.id;tr.style.setProperty('--unit-width',c.w+'px');const px=c.w/c.step,l=days(start,t.ps)*px,bw=(days(t.ps,t.pe)+1)*px;const bar=document.createElement('div');bar.className=`bar ${t.type==='task'?'plan-bar':'summary-bar'}`;bar.style.left=l+'px';bar.style.width=bw+'px';bar.dataset.id=t.id;if(t.type==='task'){bar.innerHTML=`<div class="progress-bar" style="width:${t.progress}%"></div>`}tr.appendChild(bar);if(t.as)mark(tr,days(start,t.as)*px,false);if(t.ae)mark(tr,days(start,t.ae)*px,true);if(delayed(t)){const f=document.createElement('div');f.className='delay-flag';f.textContent='遅延';f.style.left=Math.max(2,l+bw+4)+'px';tr.appendChild(f)}const td=days(start,TODAY)*px;if(td>=0&&td<=width){const line=document.createElement('div');line.className='today-line';line.style.left=td+'px';tr.appendChild(line)}right.appendChild(tr)})}
function mark(row,x,end){const m=document.createElement('div');m.className='actual-marker'+(end?' end':'');m.style.left=(x-3)+'px';row.appendChild(m)}
function openPanel(t){selected=t.id;render();$('panelTitle').textContent=t.name;$('taskNameInput').value=t.name;$('assigneeInput').value=t.assignee||'佐藤';$('statusInput').value=t.status;$('progressInput').value=t.progress;$('progressValue').textContent=t.progress+'%';$('plannedStartInput').value=t.ps;$('plannedEndInput').value=t.pe;$('actualStartInput').value=t.as;$('actualEndInput').value=t.ae;$('noteInput').value=t.note;$('formMessage').textContent='';$('editPanel').classList.add('open');$('panelBackdrop').classList.add('open')}
function closePanel(){$('editPanel').classList.remove('open');$('panelBackdrop').classList.remove('open');selected=null;render()}
function clickRow(e){const tg=e.target.closest('[data-toggle]');if(tg){e.stopPropagation();collapsed.has(tg.dataset.toggle)?collapsed.delete(tg.dataset.toggle):collapsed.add(tg.dataset.toggle);render();return}const row=e.target.closest('[data-id]');if(row){const t=tasks.find(x=>x.id===row.dataset.id);if(t)openPanel(t)}}
$('taskRows').onclick=clickRow;$('timelineRows').onclick=clickRow;$('progressInput').oninput=e=>$('progressValue').textContent=e.target.value+'%';$('closePanel').onclick=$('cancelButton').onclick=$('panelBackdrop').onclick=closePanel;
$('taskForm').onsubmit=e=>{e.preventDefault();const t=tasks.find(x=>x.id===selected);if(!t)return;const ps=$('plannedStartInput').value,pe=$('plannedEndInput').value;if(ps&&pe&&ps>pe){$('formMessage').textContent='計画終了日は計画開始日以降にしてください。';return}Object.assign(t,{name:$('taskNameInput').value||t.name,assignee:$('assigneeInput').value,status:$('statusInput').value,progress:+$('progressInput').value,ps,pe,as:$('actualStartInput').value,ae:$('actualEndInput').value,note:$('noteInput').value});if(t.progress===100)t.status='完了';closePanel()};
$('deleteTaskButton').onclick=()=>{const i=tasks.findIndex(t=>t.id===selected);if(i<0)return;if(kids(tasks[i].id).length){$('formMessage').textContent='子タスクを持つ行は削除できません。';return}tasks.splice(i,1);closePanel()};
$('addTaskButton').onclick=()=>{const t={id:'new'+tasks.length,type:'task',parent:'r',name:'新しいタスク',assignee:'佐藤',progress:0,status:'未着手',ps:TODAY,pe:addDays(TODAY,4),as:'',ae:'',note:''};tasks.push(t);openPanel(t)};
['assigneeFilter','statusFilter','delayOnly'].forEach(id=>$(id).onchange=render);$('expandAll').onclick=()=>{collapsed.clear();render()};$('collapseAll').onclick=()=>{tasks.filter(t=>kids(t.id).length).forEach(t=>collapsed.add(t.id));render()};
$('dayViewButton').onclick=()=>{mode='day';start='2026-10-07';$('dayViewButton').classList.add('active');$('weekViewButton').classList.remove('active');render()};$('weekViewButton').onclick=()=>{mode='week';start='2026-09-28';$('weekViewButton').classList.add('active');$('dayViewButton').classList.remove('active');render()};$('todayButton').onclick=()=>{start=addDays(TODAY,mode==='day'?-7:-14);render();$('timelinePane').scrollLeft=0};$('prevPeriod').onclick=()=>{start=addDays(start,mode==='day'?-7:-28);render()};$('nextPeriod').onclick=()=>{start=addDays(start,mode==='day'?7:28);render()};
$('timelinePane').onscroll=()=>{$('taskRows').style.transform=`translateY(${-$('timelinePane').scrollTop}px)`};render();
</script>
