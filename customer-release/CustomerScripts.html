<!-- bundled from InquiryCustomerRegistrationScript.html -->
<script>
(function(){
  function normalizeDomainClient(value){
    return String(value||'').trim().toLowerCase().replace(/^@/,'');
  }

  function domainFromEmail(value){
    const email=String(value||'').trim().toLowerCase();
    const at=email.lastIndexOf('@');
    return at>0&&at<email.length-1?normalizeDomainClient(email.slice(at+1)):'';
  }

  function customerForInquiry(inquiry){
    return (inquiryState.data&&inquiryState.data.customers||[]).find(function(c){return c.id===inquiry.customerId})||null;
  }

  function inboundEmailsForInquiry(inquiryId){
    const messages=inquiryState.messagesByInquiry[inquiryId]||[];
    const seen={};
    return messages.filter(function(m){return String(m.direction||'INBOUND').toUpperCase()==='INBOUND'})
      .map(function(m){return String(m.fromEmail||'').trim().toLowerCase()})
      .filter(function(email){if(!email||seen[email])return false;seen[email]=true;return true});
  }

  function emailMatchesDomain(email,domain){
    const d=domainFromEmail(email);
    const base=normalizeDomainClient(domain);
    return !!d&&!!base&&(d===base||d.endsWith('.'+base));
  }

  /**
   * 顧客判定・登録操作はフォーム内へ差し込まず、管理情報/メール対応タブと同じ行の右側へ置く。
   * 表示有無で管理情報フォーム全体が上下にずれないようにする。
   */
  function ensureClassificationPanel(){
    const modeBar=$('inquiryDetailModeBar');
    if(!modeBar)return null;
    let panel=$('inquiryClassificationAssist');
    if(panel&&panel.parentNode!==modeBar)panel.remove();
    if(!panel){
      panel=document.createElement('section');
      panel.id='inquiryClassificationAssist';
      panel.className='inquiry-classification-assist hidden';
    }
    modeBar.appendChild(panel);
    return panel;
  }

  function renderClassificationPanel(){
    const panel=ensureClassificationPanel();
    if(!panel)return;
    const inquiry=findInquiry(inquiryState.selectedId);
    if(!inquiry){panel.classList.add('hidden');panel.innerHTML='';return}

    const emails=inboundEmailsForInquiry(inquiry.id);
    if(!Object.prototype.hasOwnProperty.call(inquiryState.messagesByInquiry,inquiry.id)){
      panel.classList.remove('hidden');
      panel.innerHTML='<span class="classification-assist-status"><span>顧客判定を確認中...</span></span>';
      return;
    }

    if(!inquiry.customerId){
      const domain=emails.map(domainFromEmail).find(Boolean)||'';
      panel.classList.remove('hidden');
      panel.innerHTML='\
        <span class="classification-assist-status">\
          <span>送信元: '+(domain?escapeHtml(domain):'ドメイン不明')+'</span>\
        </span>\
        <button type="button" class="button primary classification-register-button" data-register-inquiry-customer '+(!domain?'disabled':'')+'>＋ 顧客登録</button>';
      panel.dataset.detectedDomain=domain;
      return;
    }

    if(!inquiry.contactId){
      const customer=customerForInquiry(inquiry);
      const domain=customer&&customer.domain||'';
      const candidates=emails.filter(function(email){return emailMatchesDomain(email,domain)});
      panel.classList.remove('hidden');
      panel.innerHTML='\
        <span class="classification-assist-status">\
          <span>'+(domain?'顧客ドメイン: '+escapeHtml(domain):'顧客ドメイン未設定')+'</span>\
        </span>\
        <button type="button" class="button primary classification-register-button" data-register-inquiry-contact '+(!candidates.length?'disabled':'')+'>＋ 担当者登録</button>';
      panel.dataset.contactCandidates=JSON.stringify(candidates);
      return;
    }

    panel.classList.add('hidden');
    panel.innerHTML='';
  }

  function ensureDialog(){
    if($('inquiryClassificationDialog'))return;
    const overlay=document.createElement('div');
    overlay.id='inquiryClassificationDialog';
    overlay.className='classification-dialog-overlay hidden';
    overlay.innerHTML='\
      <div class="classification-dialog" role="dialog" aria-modal="true">\
        <div class="classification-dialog-header"><div><div class="panel-kicker">問い合わせからマスタ登録</div><h3 id="classificationDialogTitle"></h3></div><button type="button" class="classification-dialog-close">×</button></div>\
        <div id="classificationDialogBody" class="classification-dialog-body"></div>\
        <div id="classificationDialogStatus" class="form-message classification-dialog-status"></div>\
        <div class="classification-dialog-actions"><button type="button" class="button subtle" data-classification-cancel>キャンセル</button><button type="button" id="classificationDialogSubmit" class="button primary">登録</button></div>\
      </div>';
    document.body.appendChild(overlay);
    overlay.querySelector('.classification-dialog-close').onclick=closeDialog;
    overlay.querySelector('[data-classification-cancel]').onclick=closeDialog;
    overlay.onclick=function(e){if(e.target===overlay)closeDialog()};
  }

  let dialogMode='';
  function closeDialog(){
    const dialog=$('inquiryClassificationDialog');
    if(dialog)dialog.classList.add('hidden');
    dialogMode='';
  }

  function openCustomerDialog(domain){
    ensureDialog();
    dialogMode='customer';
    $('classificationDialogTitle').textContent='顧客として登録';
    $('classificationDialogBody').innerHTML='\
      <label>顧客名 <span class="required">*</span><input id="classificationCustomerName" type="text" maxlength="200" placeholder="株式会社○○"></label>\
      <label>ドメイン<input id="classificationDomain" type="text" readonly value="'+escapeAttr(domain)+'"></label>\
      <div class="setting-help">登録後、この問い合わせにも顧客を設定します。</div>';
    $('classificationDialogStatus').textContent='';
    $('classificationDialogSubmit').disabled=false;
    $('classificationDialogSubmit').textContent='登録';
    $('classificationDialogSubmit').onclick=submitCustomer;
    $('inquiryClassificationDialog').classList.remove('hidden');
    setTimeout(function(){$('classificationCustomerName').focus()},0);
  }

  function openContactDialog(candidates){
    const inquiry=findInquiry(inquiryState.selectedId);
    const customer=customerForInquiry(inquiry);
    ensureDialog();
    dialogMode='contact';
    $('classificationDialogTitle').textContent='顧客担当者として登録';
    $('classificationDialogBody').innerHTML='\
      <div class="setting-help">顧客「'+escapeHtml(customer&&customer.name||'')+'」のドメインと一致する受信メールだけを候補にしています。</div>\
      <label>メールアドレス<select id="classificationContactEmail">'+candidates.map(function(email){return '<option value="'+escapeAttr(email)+'">'+escapeHtml(email)+'</option>'}).join('')+'</select></label>\
      <label>担当者名<input id="classificationContactName" type="text" maxlength="200" placeholder="氏名（未入力でも登録可）"></label>';
    $('classificationDialogStatus').textContent='';
    $('classificationDialogSubmit').disabled=false;
    $('classificationDialogSubmit').textContent='登録';
    $('classificationDialogSubmit').onclick=submitContact;
    $('inquiryClassificationDialog').classList.remove('hidden');
    setTimeout(function(){$('classificationContactName').focus()},0);
  }

  function submitCustomer(){
    const inquiry=findInquiry(inquiryState.selectedId);
    const name=String($('classificationCustomerName').value||'').trim();
    const domain=String($('classificationDomain').value||'').trim();
    if(!name){$('classificationDialogStatus').textContent='顧客名を入力してください。';return}
    setDialogBusy('顧客を登録しています...');
    google.script.run.withSuccessHandler(function(result){
      finishAction(result&&result.inquiryData,'顧客「'+name+'」を登録し、この問い合わせへ設定しました。');
    }).withFailureHandler(dialogFailure).registerCustomerFromInquiry({inquiryId:inquiry.id,customerName:name,domain:domain});
  }

  function submitContact(){
    const inquiry=findInquiry(inquiryState.selectedId);
    const email=$('classificationContactEmail').value;
    const name=String($('classificationContactName').value||'').trim();
    setDialogBusy('顧客担当者を登録しています...');
    google.script.run.withSuccessHandler(function(result){
      finishAction(result&&result.inquiryData,'顧客担当者 '+email+' を登録し、この問い合わせへ設定しました。');
    }).withFailureHandler(dialogFailure).registerContactFromInquiry({inquiryId:inquiry.id,email:email,contactName:name});
  }

  function setDialogBusy(text){
    $('classificationDialogSubmit').disabled=true;
    $('classificationDialogSubmit').textContent='処理中...';
    $('classificationDialogStatus').textContent=text;
  }

  function dialogFailure(error){
    $('classificationDialogSubmit').disabled=false;
    $('classificationDialogSubmit').textContent='登録';
    $('classificationDialogStatus').textContent='処理に失敗しました。'+(error&&error.message?error.message:String(error));
  }

  function finishAction(data,message){
    if(data)inquiryState.data=data;
    if(typeof masterState!=='undefined')masterState.data=null;
    closeDialog();
    renderInquiryScreen();
    if(typeof setInquiryDetailMode==='function')setInquiryDetailMode('manage');
    if(typeof loadDashboardData==='function')loadDashboardData(true);
    window.alert(message);
  }

  const baseRenderDetail=window.renderInquiryDetail;
  window.renderInquiryDetail=function(){
    baseRenderDetail();
    renderClassificationPanel();
  };

  document.addEventListener('click',function(e){
    const customerButton=e.target.closest('[data-register-inquiry-customer]');
    if(customerButton){e.preventDefault();openCustomerDialog(String($('inquiryClassificationAssist').dataset.detectedDomain||''));return}
    const contactButton=e.target.closest('[data-register-inquiry-contact]');
    if(contactButton){
      e.preventDefault();
      let candidates=[];
      try{candidates=JSON.parse($('inquiryClassificationAssist').dataset.contactCandidates||'[]')}catch(_e){}
      if(candidates.length)openContactDialog(candidates);
    }
  });

  const style=document.createElement('style');
  style.id='inquiryClassificationAssistStyles';
  style.textContent='\
    .inquiry-classification-assist{margin-left:auto;display:flex;align-items:center;gap:7px;min-width:0;max-width:55%;height:28px}.inquiry-classification-assist.hidden{visibility:hidden;display:flex}.classification-assist-status{display:flex;align-items:baseline;gap:6px;min-width:0;padding:3px 7px;border:1px solid #dbe3ee;background:#f8fafc;border-radius:7px;white-space:nowrap}.classification-assist-status span{font-size:9px;color:#475569;overflow:hidden;text-overflow:ellipsis}.inquiry-classification-assist .classification-register-button{padding:5px 10px;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,42,.12)}.classification-dialog-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1200}.classification-dialog-overlay.hidden{display:none}.classification-dialog{width:min(520px,100%);background:#fff;border-radius:12px;box-shadow:0 24px 70px rgba(15,23,42,.25);overflow:hidden}.classification-dialog-header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 10px;border-bottom:1px solid #e2e8f0}.classification-dialog-header h3{margin:2px 0 0;font-size:18px}.classification-dialog-close{border:0;background:transparent;font-size:24px;color:#64748b;cursor:pointer}.classification-dialog-body{padding:16px 18px;display:grid;gap:12px}.classification-dialog-body label{display:grid;gap:5px;font-size:12px;font-weight:700;color:#334155}.classification-dialog-body input,.classification-dialog-body select{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #cbd5e1;border-radius:7px}.classification-dialog-body input[readonly]{background:#f8fafc}.classification-dialog-status{padding:0 18px}.classification-dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid #e2e8f0}@media(max-width:760px){.inquiry-classification-assist{max-width:48%;gap:4px}.classification-assist-status{display:none}.inquiry-classification-assist .classification-register-button{padding:6px 8px;font-size:9px}.classification-dialog-overlay{padding:0;align-items:stretch}.classification-dialog{width:100%;border-radius:0}}\
  ';
  document.head.appendChild(style);
})();
</script>

<!-- bundled from InquiryBulkExclusionScript.html -->
<script>
(function(){
  const selectedForExclusion=new Set();

  function ensureBulkActionButton(){
    if($('excludeSelectedInquiriesButton'))return $('excludeSelectedInquiriesButton');
    const toolbar=document.querySelector('#inquiryView .toolbar-right');
    if(!toolbar)return null;
    const button=document.createElement('button');
    button.id='excludeSelectedInquiriesButton';
    button.type='button';
    button.className='button subtle inquiry-bulk-exclude-button';
    button.disabled=true;
    button.textContent='選択を対象外';
    button.onclick=excludeSelectedInquiries;
    toolbar.insertBefore(button,toolbar.firstChild);
    return button;
  }

  function eligibleVisibleInquiries(){
    return getFilteredInquiries().filter(function(inquiry){return !inquiry.customerId});
  }

  function syncBulkButton(){
    const button=ensureBulkActionButton();
    if(!button)return;
    const count=selectedForExclusion.size;
    button.disabled=count===0;
    button.textContent=count?'選択を対象外 ('+count+')':'選択を対象外';
  }

  function decorateHeader(){
    const header=document.querySelector('.inquiry-list-header.inquiry-row-grid');
    if(!header||!header.children.length)return;
    const cell=header.children[0];
    if(cell.querySelector('#selectAllExcludeCandidates'))return;
    const label=document.createElement('label');
    label.className='inquiry-bulk-select-header';
    label.innerHTML='<input id="selectAllExcludeCandidates" type="checkbox" aria-label="表示中の顧客未特定問い合わせをすべて選択"><span>受信</span>';
    cell.textContent='';
    cell.appendChild(label);
    $('selectAllExcludeCandidates').onchange=function(e){
      const checked=e.target.checked;
      eligibleVisibleInquiries().forEach(function(inquiry){
        if(checked)selectedForExclusion.add(inquiry.id);
        else selectedForExclusion.delete(inquiry.id);
      });
      renderInquiryScreen();
    };
  }

  function decorateRows(){
    document.querySelectorAll('#inquiryRows [data-inquiry-id]').forEach(function(row){
      const inquiry=findInquiry(row.dataset.inquiryId);
      if(!inquiry||inquiry.customerId||!row.children.length)return;
      const cell=row.children[0];
      if(cell.querySelector('[data-exclusion-select]'))return;
      const wrap=document.createElement('label');
      wrap.className='inquiry-bulk-select';
      wrap.title='問い合わせ対象外候補として選択';
      const checkbox=document.createElement('input');
      checkbox.type='checkbox';
      checkbox.dataset.exclusionSelect=inquiry.id;
      checkbox.checked=selectedForExclusion.has(inquiry.id);
      checkbox.setAttribute('aria-label','対象外候補として選択');
      wrap.appendChild(checkbox);
      cell.insertBefore(wrap,cell.firstChild);
    });

    const eligible=eligibleVisibleInquiries();
    const all=eligible.length>0&&eligible.every(function(inquiry){return selectedForExclusion.has(inquiry.id)});
    const some=eligible.some(function(inquiry){return selectedForExclusion.has(inquiry.id)});
    const selectAll=$('selectAllExcludeCandidates');
    if(selectAll){
      selectAll.checked=all;
      selectAll.indeterminate=!all&&some;
      selectAll.disabled=eligible.length===0;
    }
    syncBulkButton();
  }

  function removeDetailExcludeAction(){
    const button=document.querySelector('[data-exclude-inquiry-domain]');
    if(button)button.remove();
  }

  function pruneSelection(){
    if(!inquiryState.data)return;
    const valid={};
    inquiryState.data.inquiries.forEach(function(inquiry){
      if(!inquiry.customerId)valid[inquiry.id]=true;
    });
    Array.from(selectedForExclusion).forEach(function(id){
      if(!valid[id])selectedForExclusion.delete(id);
    });
  }

  function applyBulkExclusionUi(){
    pruneSelection();
    ensureBulkActionButton();
    decorateHeader();
    decorateRows();
    removeDetailExcludeAction();
  }

  const baseRenderScreen=window.renderInquiryScreen;
  window.renderInquiryScreen=function(){
    baseRenderScreen();
    applyBulkExclusionUi();
  };

  const baseRenderDetail=window.renderInquiryDetail;
  window.renderInquiryDetail=function(){
    baseRenderDetail();
    removeDetailExcludeAction();
  };

  const rows=$('inquiryRows');
  if(rows){
    rows.addEventListener('click',function(e){
      const checkbox=e.target.closest('[data-exclusion-select]');
      if(!checkbox)return;
      e.stopPropagation();
      const id=String(checkbox.dataset.exclusionSelect||'');
      if(checkbox.checked)selectedForExclusion.add(id);
      else selectedForExclusion.delete(id);
      syncBulkButton();
      const eligible=eligibleVisibleInquiries();
      const selectAll=$('selectAllExcludeCandidates');
      if(selectAll){
        const all=eligible.length>0&&eligible.every(function(inquiry){return selectedForExclusion.has(inquiry.id)});
        const some=eligible.some(function(inquiry){return selectedForExclusion.has(inquiry.id)});
        selectAll.checked=all;
        selectAll.indeterminate=!all&&some;
      }
    },true);
  }

  function excludeSelectedInquiries(){
    const ids=Array.from(selectedForExclusion);
    if(!ids.length)return;
    const confirmed=window.confirm(
      '選択した '+ids.length+' 件の送信元ドメインを、問い合わせ対象外として登録します。\n\n'+
      '登録したドメインから開始した問い合わせは、既存分も含めて一覧・ダッシュボードから非表示になります。\n'+
      '登録していない別ドメインには影響しません。データ自体は削除されません。続けますか？'
    );
    if(!confirmed)return;

    const button=ensureBulkActionButton();
    button.disabled=true;
    button.textContent='対象外登録中...';

    google.script.run
      .withSuccessHandler(function(result){
        if(result&&result.inquiryData)inquiryState.data=result.inquiryData;
        selectedForExclusion.clear();
        if(!findInquiry(inquiryState.selectedId))inquiryState.selectedId=null;
        if(typeof masterState!=='undefined')masterState.data=null;
        renderInquiryScreen();
        if(typeof loadDashboardData==='function')loadDashboardData(true);
        const domains=result&&Array.isArray(result.domains)?result.domains:[];
        const skipped=result&&Array.isArray(result.skipped)?result.skipped:[];
        let message=domains.length+'ドメインを問い合わせ対象外に登録しました。';
        if(skipped.length)message+='\n'+skipped.length+'件は顧客特定済み等の理由で対象外登録しませんでした。';
        window.alert(message);
      })
      .withFailureHandler(function(error){
        syncBulkButton();
        window.alert('対象外登録に失敗しました。 '+(error&&error.message?error.message:String(error)));
      })
      .excludeInquiryDomainsBulk({inquiryIds:ids});
  }

  const style=document.createElement('style');
  style.id='inquiryBulkExclusionStyles';
  style.textContent='\
    .inquiry-bulk-select-header{display:flex;align-items:center;gap:6px;cursor:pointer}.inquiry-bulk-select-header input{margin:0}.inquiry-bulk-select{display:inline-flex;align-items:center;margin-right:6px;vertical-align:middle;cursor:pointer}.inquiry-bulk-select input{margin:0;width:14px;height:14px}.inquiry-row-grid>div:first-child{display:flex;align-items:center}.inquiry-bulk-exclude-button:not(:disabled){color:#b91c1c;border-color:#fecaca;background:#fff7f7}.inquiry-bulk-exclude-button:not(:disabled):hover{background:#fee2e2}@media(max-width:760px){.inquiry-bulk-exclude-button{order:-1}}\
  ';
  document.head.appendChild(style);

  applyBulkExclusionUi();
})();
</script>

<!-- bundled from InquiryImportScript.html -->
<script>
(function(){
  function ensureManualImportButton(){
    if($('manualInquiryImportButton'))return $('manualInquiryImportButton');
    const toolbar=document.querySelector('#inquiryView .toolbar-right');
    if(!toolbar)return null;
    const button=document.createElement('button');
    button.id='manualInquiryImportButton';
    button.type='button';
    button.className='button subtle';
    button.textContent='メール取込';
    button.title='Gmailから問い合わせメールを今すぐ取り込みます';
    button.onclick=runManualInquiryImport;
    toolbar.appendChild(button);
    return button;
  }

  function runManualInquiryImport(){
    const button=ensureManualImportButton();
    if(!button||button.disabled)return;
    button.disabled=true;
    button.textContent='取込中...';

    google.script.run
      .withSuccessHandler(function(result){
        button.disabled=false;
        button.textContent='メール取込';

        if(result&&result.reason==='LOCKED'){
          window.alert('別のメール取込処理が実行中です。少し待ってから再度お試しください。');
          return;
        }

        inquiryState.messagesByInquiry={};
        inquiryState.messageLoadingId=null;
        inquiryState.data=null;
        loadInquiryData(true);
        if(typeof loadDashboardData==='function')loadDashboardData(true);

        const imported=Number(result&&result.imported||0);
        const skipped=Number(result&&result.skipped||0);
        const errors=Number(result&&result.errors||0);
        let message='メール取込が完了しました。\n新規取込: '+imported+'件';
        if(skipped)message+='\n取込済み・対象外等: '+skipped+'件';
        if(errors)message+='\nエラー: '+errors+'件';
        if(imported===0&&!errors)message+='\n新しく取り込むメールはありませんでした。';
        window.alert(message);
      })
      .withFailureHandler(function(error){
        button.disabled=false;
        button.textContent='メール取込';
        window.alert('メール取込に失敗しました。 '+(error&&error.message?error.message:String(error)));
      })
      .importInquiryEmails({force:true});
  }

  ensureManualImportButton();
})();
</script>

<!-- bundled from InquiryReassessScript.html -->
<script>
(function(){
  const button=$('reassessUnmatchedInquiries');
  if(!button)return;

  button.onclick=function(){
    const data=inquiryState.data||{inquiries:[]};
    const unmatched=(data.inquiries||[]).filter(function(inquiry){
      return inquiry.customerMatchStatus==='UNMATCHED'||inquiry.customerMatchStatus==='AMBIGUOUS';
    }).length;

    if(!unmatched){
      window.alert('再判定が必要な問い合わせはありません。');
      return;
    }
    if(!window.confirm('顧客未特定・候補複数の問い合わせ '+unmatched+'件を、現在の顧客・担当者マスタで再判定します。よろしいですか？'))return;

    button.disabled=true;
    const originalText=button.textContent;
    button.textContent='再判定中...';

    google.script.run
      .withSuccessHandler(function(result){
        button.disabled=false;
        button.textContent=originalText;
        if(result&&result.data)inquiryState.data=result.data;
        renderInquiryScreen();
        if(typeof loadDashboardData==='function')loadDashboardData(true);
        const checked=Number(result&&result.checked||0);
        const matched=Number(result&&result.matched||0);
        const remaining=Number(result&&result.remaining||0);
        window.alert('再判定しました。\n対象: '+checked+'件\n自動特定: '+matched+'件\n未特定のまま: '+remaining+'件');
      })
      .withFailureHandler(function(error){
        button.disabled=false;
        button.textContent=originalText;
        window.alert('顧客の再判定に失敗しました。\n'+(error&&error.message?error.message:String(error)));
      })
      .reassessUnmatchedInquiriesV2();
  };
})();
</script>

<!-- bundled from MobileScript.html -->
<script>
(function(){
  const mobileQuery=window.matchMedia('(max-width:760px)');

  function ensureInquiryBackButton(){
    if($('mobileInquiryBack'))return;
    const pane=$('inquiryDetail');
    if(!pane)return;
    const button=document.createElement('button');
    button.type='button';
    button.id='mobileInquiryBack';
    button.className='mobile-detail-back';
    button.textContent='← 問い合わせ一覧へ戻る';
    button.onclick=function(){
      $('inquiryView').classList.remove('mobile-detail-open');
    };
    pane.insertBefore(button,pane.firstChild);
  }

  function ensureMasterBackButton(){
    if($('mobileMasterBack'))return;
    const pane=document.querySelector('.master-editor-pane');
    if(!pane)return;
    const button=document.createElement('button');
    button.type='button';
    button.id='mobileMasterBack';
    button.className='mobile-master-back';
    button.textContent='← マスタ一覧へ戻る';
    button.onclick=function(){pane.classList.remove('mobile-editor-open')};
    pane.insertBefore(button,pane.firstChild);
  }

  function syncInquiryMobileDetail(){
    if(!mobileQuery.matches){
      $('inquiryView').classList.remove('mobile-detail-open');
      return;
    }
    if(inquiryState&&inquiryState.selectedId)$('inquiryView').classList.add('mobile-detail-open');
  }

  ensureInquiryBackButton();
  ensureMasterBackButton();

  const previousSelectInquiry=window.selectInquiry;
  window.selectInquiry=function(id){
    previousSelectInquiry(id);
    if(mobileQuery.matches)$('inquiryView').classList.add('mobile-detail-open');
  };

  const previousOpenDashboardInquiry=window.openDashboardInquiry;
  window.openDashboardInquiry=function(id){
    previousOpenDashboardInquiry(id);
    if(mobileQuery.matches){
      const wait=setInterval(function(){
        if(inquiryState&&inquiryState.selectedId===id){
          clearInterval(wait);
          $('inquiryView').classList.add('mobile-detail-open');
        }
      },80);
      setTimeout(function(){clearInterval(wait)},5000);
    }
  };

  const masterRows=$('masterRows');
  if(masterRows){
    masterRows.addEventListener('click',function(){
      if(mobileQuery.matches){
        setTimeout(function(){
          const pane=document.querySelector('.master-editor-pane');
          const form=$('masterForm');
          if(pane&&form&&!form.classList.contains('hidden'))pane.classList.add('mobile-editor-open');
        },0);
      }
    });
  }

  const newMasterButton=$('newMasterButton');
  if(newMasterButton){
    newMasterButton.addEventListener('click',function(){
      if(mobileQuery.matches){
        setTimeout(function(){
          const pane=document.querySelector('.master-editor-pane');
          if(pane)pane.classList.add('mobile-editor-open');
        },0);
      }
    });
  }

  mobileQuery.addEventListener('change',function(){
    syncInquiryMobileDetail();
    if(!mobileQuery.matches){
      const pane=document.querySelector('.master-editor-pane');
      if(pane)pane.classList.remove('mobile-editor-open');
    }
  });
})();
</script>

<!-- bundled from UserMasterScript.html -->
<script>
(function(){
  const tab=document.getElementById('usersMasterTab');
  const importButton=document.getElementById('importMembersAsUsersButton');

  // 初期管理者が未登録でもメニュー自体を見せ、原因を分かるようにする。
  // データ取得・登録はサーバーAPIのADMIN権限検証で必ず制限する。
  if(tab)tab.classList.remove('hidden');
  google.script.run
    .withSuccessHandler(function(identity){
      if(!tab)return;
      tab.title=identity&&identity.role==='ADMIN'?'ユーザマスタを管理できます':
        !identity||!identity.emailAvailable?'ユーザー識別不可。Workspaceの公開設定を検証してください。':
        '管理者未登録です。Usersシートに初期ADMINを登録してください。';
    })
    .withFailureHandler(function(){if(tab)tab.title='ログイン確認に失敗しました。'})
    .checkWorkspaceIdentity();

  if(!importButton)return;
  importButton.onclick=function(){
    importButton.disabled=true;
    google.script.run.withSuccessHandler(function(result){
      importButton.disabled=false;
      const candidates=result&&result.candidates||[];
      const old=document.getElementById('userImportDialog');
      if(old)old.remove();
      const overlay=document.createElement('div');
      overlay.id='userImportDialog';
      overlay.className='classification-dialog-overlay';
      const dialog=document.createElement('section');
      dialog.className='classification-dialog';
      dialog.setAttribute('role','dialog');
      dialog.setAttribute('aria-modal','true');
      const header=document.createElement('div');
      header.className='classification-dialog-header';
      header.innerHTML='<div><h3>社内メンバーからユーザー登録</h3><small>選択した人を「一般ユーザー・有効」で追加します。</small></div>';
      const cancel=document.createElement('button');
      cancel.className='button';
      cancel.type='button';
      cancel.textContent='閉じる';
      cancel.onclick=function(){overlay.remove()};
      header.appendChild(cancel);
      dialog.appendChild(header);
      const body=document.createElement('div');
      body.className='classification-dialog-body';
      body.style.maxHeight='50vh';
      body.style.overflowY='auto';
      if(!candidates.length)body.textContent='取り込み可能なメンバーがいません（登録済み、無効、メール未設定、またはドメイン不一致）。';
      candidates.forEach(function(m){
        const label=document.createElement('label');
        label.style.display='flex';
        label.style.alignItems='center';
        label.style.gap='8px';
        const checkbox=document.createElement('input');
        checkbox.type='checkbox';
        checkbox.value=m.memberId;
        checkbox.checked=true;
        checkbox.style.width='auto';
        label.appendChild(checkbox);
        const name=document.createElement('span');
        name.textContent=m.name+' / '+m.email;
        label.appendChild(name);
        body.appendChild(label);
      });
      dialog.appendChild(body);
      const actions=document.createElement('div');
      actions.className='classification-dialog-actions';
      const submit=document.createElement('button');
      submit.className='button primary';
      submit.type='button';
      submit.textContent='選択したメンバーを登録';
      submit.disabled=!candidates.length;
      submit.onclick=function(){
        const ids=Array.from(body.querySelectorAll('input:checked')).map(function(el){return el.value});
        if(!ids.length){window.alert('対象を選択してください。');return}
        if(!window.confirm(ids.length+'名を一般ユーザーとして登録します。よろしいですか？'))return;
        submit.disabled=true;
        submit.textContent='登録中...';
        google.script.run.withSuccessHandler(function(result){
          overlay.remove();
          masterState.data=masterState.data||{};
          masterState.data.users=result.users||[];
          masterState.selectedId=null;
          masterState.creating=false;
          renderMasterScreen();
          window.alert((result.created||0)+'名を登録しました。');
        }).withFailureHandler(function(error){
          submit.disabled=false;
          submit.textContent='選択したメンバーを登録';
          window.alert('登録に失敗しました。'+(error&&error.message||error));
        }).importMembersAsUsers({memberIds:ids});
      };
      actions.appendChild(submit);
      dialog.appendChild(actions);
      overlay.appendChild(dialog);
      document.body.appendChild(overlay);
    }).withFailureHandler(function(error){
      importButton.disabled=false;
      window.alert('取り込み候補の取得に失敗しました。'+(error&&error.message||error));
    }).previewMembersForUserImport();
  };
})();
</script>
